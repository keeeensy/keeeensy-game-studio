<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Исходник иконки лаунчера. ICO собирается из него: assets/launcher/icon.ico -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#b45cc8"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#2a0f5c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Скруглённый квадрат с градиентом и бликом сверху -->
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#shine)"/>
  <rect x="9" y="9" width="238" height="238" rx="57" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Кнопка «Играть» со скруглёнными углами -->
  <path d="M100 80 L100 176 L180 128 Z" fill="#fff" stroke="#fff" stroke-width="22" stroke-linejoin="round" filter="url(#soft)"/>

  <!-- Звезда ✦ — знак Keeeensy (на маленьких размерах скрыта) -->
  <path class="spark" d="M196 44 C197.5 58 200 60.5 214 62 C200 63.5 197.5 66 196 80 C194.5 66 192 63.5 178 62 C192 60.5 194.5 58 196 44 Z" fill="#fff" fill-opacity="0.92"/>
</svg>
